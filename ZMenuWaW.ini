; ZMenu WaW settings. Key values are Windows virtual-key codes in decimal
; (F1-F12 = 112-123, Numpad 0-9 = 96-105, arrows = 37 left / 38 up / 39 right / 40 down, Enter = 13, Backspace = 8).
; Set an Alt key to 0 to disable it.

[Settings]
; 1 = inject ZMenuWaW.gsc into the level script (needed for god mode, ammo, explosive bullets, AI spawning...)
LoadScripts=1

[Keys]
Open=118
Up=104
UpAlt=38
Down=98
DownAlt=40
Left=100
LeftAlt=37
Right=102
RightAlt=39
Select=101
SelectAlt=13
Back=96
BackAlt=8
Bind=106
BindAlt=45
; Grenade fountain (only while Rapid Fire is on): hold to pour out frags / special grenades. G = 71, 4 = 52
Grenade=71
SpecialGrenade=52

[Hotkeys]
; Set from the menu: highlight an item, press the Bind key (Numpad *), then the key you want.
; Entries are "Menu label=virtual key code", 0 = no hotkey. Mouse buttons: 4 = middle, 5 / 6 = side buttons.
Bullet Time=4
Quick Save=116
Quick Load=120
